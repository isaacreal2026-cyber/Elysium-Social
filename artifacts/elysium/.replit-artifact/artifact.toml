kind = "mobile"
previewPath = "/"
title = "ELYSIUM"
version = "1.0.0"
id = "artifacts/elysium"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23543

[services.development]
run = "pnpm --filter @workspace/elysium run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elysium", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/elysium", "run", "serve" ]

[services.env]
PORT = "23543"
BASE_PATH = "/"
